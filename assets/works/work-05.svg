  <circle cx="400" cy="180" r="50" fill="#f0c08a"/>
  <rect x="360" y="230" width="80" height="120" rx="8" fill="#d4522a"/>
  <rect x="330" y="240" width="32" height="90" rx="6" fill="#d4522a"/>
