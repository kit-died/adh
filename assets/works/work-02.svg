<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Neon / poster style -->
  <circle cx="400" cy="300" r="220" stroke="#d4522a" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="400" cy="300" r="180" stroke="#d4522a" stroke-width="1" fill="none" opacity="0.3"/>
  <line x1="100" y1="300" x2="700" y2="300" stroke="#f8f7f4" stroke-width="1" opacity="0.15"/>
  <line x1="400" y1="60" x2="400" y2="540" stroke="#f8f7f4" stroke-width="1" opacity="0.15"/>
  <!-- Large letter mark -->
  <text x="400" y="340" font-family="Georgia,serif" font-size="200" font-weight="700" text-anchor="middle" fill="#d4522a" opacity="0.9">A</text>
  <!-- Stars / dots -->
  <circle cx="160" cy="160" r="4" fill="#f5a623"/>
  <circle cx="640" cy="160" r="4" fill="#f5a623"/>
  <circle cx="160" cy="440" r="4" fill="#f5a623"/>
  <circle cx="640" cy="440" r="4" fill="#f5a623"/>
  <circle cx="400" cy="80" r="3" fill="#f8f7f4" opacity="0.5"/>
  <circle cx="400" cy="520" r="3" fill="#f8f7f4" opacity="0.5"/>
</svg>
